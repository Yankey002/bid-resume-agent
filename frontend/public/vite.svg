<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纸飞机的渐变 -->
    <linearGradient id="grad1" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="grad2" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>

    <!-- 光环的径向渐变 -->
    <radialGradient id="haloGrad" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#764ba2" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景光环 (模拟 CSS 的 halo 效果) -->
  <circle cx="100" cy="100" r="90" fill="url(#haloGrad)" />
  <circle cx="100" cy="100" r="70" stroke="url(#grad1)" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4"/>

  <!-- 纸飞机主体 -->
  <path d="M40 100 L170 30 L100 160 L85 115 L115 85" fill="url(#grad2)" stroke="white" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- 速度线/流线型装饰，增加动感 -->
  <path d="M20 120 Q50 130 80 120" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <path d="M10 100 Q40 110 70 100" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
</svg>
